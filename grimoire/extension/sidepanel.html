<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Familiar’s Panel</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/sidepanel.css">
  </head>
  <body data-accent="ember">
    <header class="panel-header">
      <div class="familiar-orb" aria-hidden="true"><span></span></div>
      <div>
        <span class="section-kicker">Your quiet companion</span>
        <h1>Familiar’s Panel</h1>
      </div>
      <button id="panel-newtab" class="icon-button" type="button" title="Open the full Grimoire" aria-label="Open the full Grimoire">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm3 2H7v11a1 1 0 0 0 1 1h9V7a1 1 0 0 0-1-1H8Zm2 3h5v2h-5V9Zm0 4h5v2h-5v-2Z"/></svg>
      </button>
    </header>

    <nav class="panel-tabs" aria-label="Familiar sections">
      <button class="panel-tab active" type="button" data-panel="quests" aria-selected="true">Quests</button>
      <button class="panel-tab" type="button" data-panel="note" aria-selected="false">Scratchpad</button>
      <button class="panel-tab" type="button" data-panel="focus" aria-selected="false">Focus</button>
    </nav>

    <main>
      <section id="panel-quests" class="panel-view active" aria-labelledby="panel-quests-title">
        <div class="panel-section-heading">
          <div>
            <span class="section-kicker">Quest Ledger</span>
            <h2 id="panel-quests-title">What asks your hand?</h2>
          </div>
          <span id="panel-quest-count" class="counter">0</span>
        </div>
        <form id="panel-quest-form" class="panel-quest-form">
          <label class="visually-hidden" for="panel-quest-input">Add a quest</label>
          <input id="panel-quest-input" maxlength="120" autocomplete="off" placeholder="Inscribe a quest…">
          <button type="submit">+</button>
        </form>
        <ul id="panel-quest-list" class="panel-quest-list"></ul>
        <p id="panel-empty-quests" class="panel-empty">Nothing demands you. Breathe.</p>
      </section>

      <section id="panel-note" class="panel-view" aria-labelledby="panel-note-title" hidden>
        <div class="panel-section-heading">
          <div>
            <span class="section-kicker">Unbound parchment</span>
            <h2 id="panel-note-title">The Scratchpad</h2>
          </div>
          <span id="note-status" class="save-status" role="status" aria-live="polite"></span>
        </div>
        <label class="visually-hidden" for="scratchpad">Scratchpad note</label>
        <textarea id="scratchpad" class="scratchpad" maxlength="6000" placeholder="Catch a thought before it escapes…"></textarea>
        <div class="note-footer"><span id="note-count">0 / 6000</span><button id="clear-note" class="text-button" type="button">Clear</button></div>
      </section>

      <section id="panel-focus" class="panel-view" aria-labelledby="panel-focus-title" hidden>
        <div class="panel-section-heading">
          <div>
            <span class="section-kicker">Ritual of Focus</span>
            <h2 id="panel-focus-title">Keep the ward.</h2>
          </div>
        </div>
        <div class="panel-focus-orb" role="timer" aria-live="polite">
          <span id="panel-focus-time">25:00</span>
          <small id="panel-focus-state">ready</small>
        </div>
        <div class="panel-focus-actions">
          <button id="panel-focus-toggle" class="primary-button" type="button">Begin ritual</button>
          <button id="panel-focus-reset" class="secondary-button" type="button">Reset</button>
        </div>
        <div class="duration-row" aria-label="Focus duration">
          <button type="button" data-minutes="15">15</button>
          <button type="button" data-minutes="25" class="active">25</button>
          <button type="button" data-minutes="45">45</button>
          <button type="button" data-minutes="60">60</button>
        </div>
      </section>
    </main>

    <footer class="panel-footer">
      <span id="panel-oracle">Attend to what is yours to shape.</span>
      <button id="panel-options" class="text-button" type="button">Settings</button>
    </footer>

    <div id="panel-toast" class="toast-region" aria-live="polite"></div>
    <script type="module" src="scripts/sidepanel.js"></script>
  </body>
</html>
